<style>
body {

}

#info {

}

}

    height:60px;

    if(lv >= levels.length){
        
        playSound(completeSound);

        alert(
            language === "zh"
            ? "通关了！！！"
            : "You Win!!!"
        );

        level = 0;
    }

    platforms = JSON.parse(JSON.stringify(levels[level]));

    player.x = 50;
    player.y = 200;

    player.vx = 0;
    player.vy = 0;

    trail = [];

    document.getElementById("info").innerText =
        language === "zh"
        ? "关卡: " + (level+1)
        : "Level: " + (level+1);
}

// 碰撞
function circleRectCollision(p, r){

    let nx = Math.max(r.x, Math.min(p.x, r.x+r.w));
    let ny = Math.max(r.y, Math.min(p.y, r.y+r.h));

    let dx = p.x - nx;
    let dy = p.y - ny;

    return dx*dx + dy*dy < p.r*p.r;
}

// 死亡
function die(){

    playSound(deathSound);

    loadLevel(level);
}

// 更新
function update(){

frame++;

let touchedSpeed = false;

// 左右
if(keys["ArrowLeft"] || keys["a"] || keys["A"])
    player.vx -= 0.4;

if(keys["ArrowRight"] || keys["d"] || keys["D"])
    player.vx += 0.4;

// 跳跃
if(keys["ArrowUp"] || keys["w"] || keys["W"] || keys[" "]){

    if(player.onGround){

        player.vy = -6;

        player.onGround = false;

        player.jumpTime = 0;
    }

    if(player.jumpTime < maxJumpTime){

        player.vy -= 0.35;

        player.jumpTime++;
    }
}

// 重力
player.vy += gravity;

// 惯性
player.vx *= friction;

// X轴
player.x += player.vx;

platforms.forEach(p=>{

    if(circleRectCollision(player,p)){

        if(p.type==="death") die();

        if(player.vx > 0)
            player.x = p.x - player.r;

        if(player.vx < 0)
            player.x = p.x + p.w + player.r;

        player.vx = 0;
    }
});

// Y轴
player.y += player.vy;

player.onGround = false;

platforms.forEach(p=>{

    if(circleRectCollision(player,p)){

        if(p.type==="death"){
            die();
            return;
        }

        if(p.type==="bounce" && player.vy > 0){

            player.y = p.y - player.r;

            player.vy = -15;

            return;
        }

        if(player.vy > 0){

            player.y = p.y - player.r;

            player.vy = 0;

            player.onGround = true;

            if(p.type === "speed"){
                touchedSpeed = true;
            }
        }
        else if(player.vy < 0){

            player.y = p.y + p.h + player.r;

            player.vy = 0;
        }
    }
});

// 加速系统
player.onSpeedPad = touchedSpeed;

// 动态限速
let maxSpeed =
    player.onSpeedPad
    ? speedPadMaxSpeed
    : normalMaxSpeed;

// 限速
player.vx = Math.max(
    -maxSpeed,
    Math.min(maxSpeed, player.vx)
);

// 加速板提供推力
if(player.onSpeedPad){

    if(player.vx > 0)
        player.vx += 0.4;

    if(player.vx < 0)
        player.vx -= 0.4;
}

// 过关
if(player.x > c.width){

    playSound(passSound);

    level++;

    localStorage.setItem("savedLevel", level);

    loadLevel(level);
}

// 边界
if(player.y > 600){
    die();
}

if(player.x < -10){
    die();
}

// 尾迹
if(frame % 4 === 0){

    trail.push({
        x:player.x,
        y:player.y,
        life:1
    });
}

trail.forEach(t=>t.life -= 0.04);

trail = trail.filter(t=>t.life > 0);
}

// 绘制
function draw(){

ctx.clearRect(0,0,c.width,c.height);

// 尾迹
trail.forEach(t=>{

    ctx.globalAlpha = t.life;

    ctx.beginPath();

    ctx.arc(t.x,t.y,player.r,0,Math.PI*2);

    ctx.fillStyle = playerColor;

    ctx.fill();
});

ctx.globalAlpha = 1;

// 地形
platforms.forEach(p=>{

    ctx.fillStyle =
        p.type==="death" ? "red" :
        p.type==="bounce" ? "#f0d124" :
        p.type==="speed" ? "green" :
        "black";

    ctx.fillRect(p.x,p.y,p.w,p.h);
});

// 玩家
ctx.beginPath();

ctx.arc(player.x,player.y,player.r,0,Math.PI*2);

ctx.fillStyle = playerColor;

ctx.fill();
}

// 循环
function loop(){

    if(gameStarted){
        update();
    }

    draw();

    requestAnimationFrame(loop);
}

loop();

// 跳关
document.addEventListener("keydown", function(e){

    if(e.key === "/" && gameStarted){
        
        playSound(clickSound);

        let input = prompt(
            language === "zh"
            ? "输入关卡号（从1开始）:"
            : "Enter level number:"
        );

        if(input === null) return;

        let target = parseInt(input) - 1;

        if(isNaN(target))
            return alert(
                language === "zh"
                ? "请输入数字"
                : "Please enter a number"
            );

        if(target < 0 || target >= levels.length)
            return alert(
                language === "zh"
                ? "关卡不存在"
                : "Level does not exist"
            );

        level = target;

        loadLevel(level);
    }
});

    ctx2.fillStyle = previewColor;

    ctx2.fill();
