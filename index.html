<style>
body {
    margin:0;
    background:#ddd;
    overflow:hidden;

    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

canvas {
    display:block;
    margin:auto;
    background:#eee;
}

#game{
    outline:none;
    box-shadow:none;
}

#game:focus{
    outline:none;
}

#info {
    position:absolute;
    top:10px;
    left:10px;
    z-index:5;
}

#versionInfo{
    position:absolute;
    left:10px;
    bottom:10px;
    z-index:999;

    font-size:18px;
    color:#000;
}

/* 菜单 */

#menu{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#ddd;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:10px;
    z-index:10;
}

#switchLevelsText,
#backToMainText,
#openAchText{
    margin:0px;
}

#skinMenu{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:#ddd;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:20px;

    z-index:11;
}

#backSkin,
#confirmSkin{

    margin-top:30px;
    transition:0.15s;

}

#backSkin:hover,
#confirmSkin:hover{
    transform:scale(1.1);
}

#colorButtons{

    transform: translateY(-30px);

}

#skinMenu button{

    width:100px;
    height:50px;

    font-size:20px;

    margin:5px;
    cursor:crosshair;
    transition:0.15s;
}

#skinMenu button:disabled{

    cursor:default;

    transform:none !important;
}

#menu h1{
    font-size:50px;
    margin:0;
}

#menu button{
    width:300px;
    height:100px;
    font-size:24px;
    cursor:crosshair;
    transition:0.15s;
}

#menu button:disabled{
    cursor:default;
}

#menu button:not(:disabled):hover{
    transform:scale(1.05);
}

#colorButtons button:not(:disabled):hover{
    transform:scale(1.1);
}

#deleteConfirm{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#ddd;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:999;
}

#deleteConfirm button{
    width:160px;
    height:70px;
    font-size:24px;
    cursor:crosshair;

    transition:0.15s;
}

#deleteConfirm button:hover{
    transform:scale(1.1);
}

#achBtn{

    position:absolute;

    right:80px;
    top:400px;

    width:70px;
    height:70px;

    font-size:36px;

    cursor:crosshair;

    z-index:20;

    transition:0.15s;
}

#achBtn:hover{

    transform:scale(1.05);
}

#achBtn:active{

    transform:scale(0.95);
}

#achMenu{

    position:absolute;
    left:0;
    top:0;

    width:100%;
    height:100%;

    background:#ddd;

    display:flex;
    flex-direction:column;

    align-items:center;

    padding-top:50px;

    gap:20px;

    z-index:20;
}

#achList{
    width:60%;
    max-height:50vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;

    padding-right:10px;
}

#achList::-webkit-scrollbar{
    width:10px;
}

#achList::-webkit-scrollbar-thumb{
    background:#888;
    border-radius:5px;
}

#achList::-webkit-scrollbar-track{
    background:#eee;
}

.achItem{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;
    background:white;

    padding:20px;
    min-height:40px;
    border:4px solid black;

    font-size:28px;
}

#achExit{

    width:100px;
    height:50px;

    font-size:20px;

    cursor:crosshair;

    transition:0.15s;
}

#achExit:hover{

    transform:scale(1.05);
}

#mobileBtn{

    position:absolute;

    left:80px;
    top:400px;

    width:70px;
    height:70px;

    font-size:36px;

    cursor:crosshair;

    z-index:20;

    transition:0.15s;
}

#mobileBtn:hover{

    transform:scale(1.05);
}

#mobileBtn:active{

    transform:scale(0.95);
}

/* 手机版按钮 */

#mobileLeft,
#mobileRight,
#mobileJump,
#mobileExit{

    position:absolute;

    width:90px;
    height:90px;

    font-size:42px;

    border:none;

    background:white;

    z-index:50;

    cursor:crosshair;

    transition:0.1s;

    opacity:0.8;
}

#mobileLeft:active,
#mobileRight:active,
#mobileJump:active,
#mobileExit:active{

    transform:scale(0.92);

    opacity:1;
}

#mobileLeft{

    left:25px;
    bottom:25px;
}

#mobileRight{

    left:130px;
    bottom:25px;
}

#mobileJump{

    right:25px;
    bottom:25px;
}

#mobileExit{

    left:20px;
    top:50px;

    width:70px;
    height:70px;

    font-size:32px;
}

#achUnlockPopup{

    position:absolute;

    top:80px;
    left:-300px;

    width:270px;
    height:100px;

    background:white;

    border:4px solid black;

    border-radius:20px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    gap:5px;

    z-index:999;

    transition:0.6s;
}

#achUnlockText{
    margin:0;
    font-size:22px;
}

#achUnlockDesc{
    font-size:18px;
    text-align:center;
    padding:0 10px;
}

#unlockPopup{

    position:absolute;

    top:20px;
    right:-300px;

    width:270px;
    height:140px;

    background:white;

    border:4px solid black;

    border-radius:20px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    gap:5px;

    z-index:99;

    transition:0.6s;
}

#unlockText{
    margin:0;
}

#unlockPreview{
    display:block;
    margin:0 auto;
}

#messagePopup{

    position:absolute;

    top:-100px;
    left:50%;

    transform:translateX(-50%);

    min-width:260px;
    max-width:500px;

    padding:20px 30px;

    background:white;

    border:4px solid black;

    border-radius:20px;

    display:flex;

    justify-content:center;
    align-items:center;

    z-index:1000;

    transition:0.3s;
}

#messageText{

    margin:0;

    text-align:center;

    font-size:28px;
}

#inputPopup{

    position:absolute;

    top:-250px;
    left:50%;

    transform:translateX(-50%);

    width:320px;

    padding:25px;

    background:white;

    border:4px solid black;

    border-radius:20px;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:10px;

    z-index:1001;

    transition:0.3s;

    opacity:0;

    pointer-events:none;
}

#popupInput{

    width:240px;

    height:40px;

    font-size:24px;

    text-align:center;
}

#popupConfirm{

    width:120px;

    height:50px;

    font-size:24px;

    cursor:crosshair;
}

</style>

</head>

// 碰撞
function circleRectCollision(p, r){

    let nx = Math.max(r.x, Math.min(p.x, r.x+r.w));
    let ny = Math.max(r.y, Math.min(p.y, r.y+r.h));

    let dx = p.x - nx;
    let dy = p.y - ny;

    return dx*dx + dy*dy < p.r*p.r;
}

// 死亡
function die(){

    playSound(deathSound);

    loadLevel(level);
}

// 更新
function update(){

frame++;

let touchedSpeed = false;

// 左右
if(keys["ArrowLeft"] || keys["a"] || keys["A"])
    player.vx -= 0.4;

if(keys["ArrowRight"] || keys["d"] || keys["D"])
    player.vx += 0.4;

// 跳跃
if(keys["ArrowUp"] || keys["w"] || keys["W"] || keys[" "]){

    if(player.onGround){

        player.vy = -6;

        player.onGround = false;

        player.jumpTime = 0;
    }

    if(player.jumpTime < maxJumpTime){

        player.vy -= 0.35;

        player.jumpTime++;
    }
}

// 重力
player.vy += gravity;

// 惯性
player.vx *= friction;

// X轴
player.x += player.vx;

platforms.forEach(p=>{

    if(circleRectCollision(player,p)){

        if(p.type==="death" && !cheatMode){
             die();
        }

        if(player.vx > 0)
            player.x = p.x - player.r;

        if(player.vx < 0)
            player.x = p.x + p.w + player.r;

        player.vx = 0;
    }
});

// Y轴
player.y += player.vy;

player.onGround = false;

platforms.forEach(p=>{

    if(circleRectCollision(player,p)){

        if(p.type==="death" && !cheatMode){
            die();
            return;
        }

        if(p.type==="bounce" && player.vy > 0){

            player.y = p.y - player.r;

            player.vy = -15;

            return;
        }

        if(player.vy > 0){

            player.y = p.y - player.r;

            player.vy = 0;

            player.onGround = true;

            if(p.type === "speed"){
                touchedSpeed = true;
            }
        }
        else if(player.vy < 0){

            player.y = p.y + p.h + player.r;

            player.vy = 0;
        }

        /*踩鼠标 if(mousePlatformCheat){

            const px = player.x;

});

// 加速系统
player.onSpeedPad = touchedSpeed;

// 动态限速
let maxSpeed =
    player.onSpeedPad
    ? speedPadMaxSpeed
    : normalMaxSpeed;

// 限速
player.vx = Math.max(
    -maxSpeed,
    Math.min(maxSpeed, player.vx)
);

// 加速板提供推力
if(player.onSpeedPad){

    if(player.vx > 0)
        player.vx += 0.4;

    if(player.vx < 0)
        player.vx -= 0.4;
}

// 过关
if(player.x > c.width){

    playSound(passSound);

    const completedLevel = level + 1;

    unlockSkinByLevel(completedLevel);

    if(completedLevel === 1){
        unlockAchievement("finish_level_1");
    }

    const achCompletedLevel = level + 1;

    if(achCompletedLevel === 1 && playerColor === "#eee"){
        unlockAchievement("nige_1");
    }

    if(achCompletedLevel === 2 && playerColor === "#eee" && nige1?.unlocked){
        unlockAchievement("nige_2");
    }

    if(achCompletedLevel === 3 && playerColor === "#eee" && nige2?.unlocked){
        unlockAchievement("nige_3");
    }

    if(!levelCleared.includes(level)){
        levelCleared.push(level);

        localStorage.setItem(
            "levelCleared",
            JSON.stringify(levelCleared)
        );
    }

    checkFinishAll();

    level++;

    localStorage.setItem("savedLevel", level);

    loadLevel(level);
}

// 边界
if(player.y > 600){
    die();
}

if(player.x < -10){
    die();
}

// 尾迹
if(frame % 4 === 0){

    trail.push({
        x:player.x,
        y:player.y,
        life:1
    });
}

trail.forEach(t=>t.life -= 0.04);

trail = trail.filter(t=>t.life > 0);
}

// 绘制
function draw(){

ctx.clearRect(0,0,c.width,c.height);

// 尾迹
trail.forEach(t=>{

    ctx.globalAlpha = t.life;

    ctx.beginPath();

    ctx.arc(t.x,t.y,player.r,0,Math.PI*2);

    ctx.fillStyle = playerColor;

    ctx.fill();
});

ctx.globalAlpha = 1;

// 地形
platforms.forEach(p=>{

    ctx.fillStyle =
        p.type==="death" ? "red" :
        p.type==="bounce" ? "#f0d124" :
        p.type==="speed" ? "green" :
        "black";

    ctx.fillRect(p.x,p.y,p.w,p.h);
});

// 玩家
ctx.beginPath();

ctx.arc(player.x,player.y,player.r,0,Math.PI*2);

ctx.fillStyle = playerColor;

ctx.fill();
}

// 循环
function loop(){

    const achBtn =
        document.getElementById("achBtn");

    const mobileBtn =
        document.getElementById("mobileBtn");

    const mobileExit =
        document.getElementById("mobileExit");

    document.getElementById("versionInfo").style.display =
        gameStarted ? "none" : "block";

    const skinOpen =
        document.getElementById("skinMenu").style.display === "flex";

    const achOpen =
        document.getElementById("achMenu").style.display === "flex";

    // 主菜单按钮显示
    if(gameStarted || skinOpen || achOpen){

        achBtn.style.display = "none";
        mobileBtn.style.display = "none";

    }else{

        achBtn.style.display = "block";
        mobileBtn.style.display = "block";
    }

    // 手机端控制显示
    if(gameStarted && mobileMode){

        document.getElementById("mobileLeft").style.display = "block";
        document.getElementById("mobileRight").style.display = "block";
        document.getElementById("mobileJump").style.display = "block";
        mobileExit.style.display = "block";

    }else{

        document.getElementById("mobileLeft").style.display = "none";
        document.getElementById("mobileRight").style.display = "none";
        document.getElementById("mobileJump").style.display = "none";
        mobileExit.style.display = "none";
    }

    if(gameStarted){
        update();
    }

    draw();

    requestAnimationFrame(loop);
}

loop();

// 跳关
document.addEventListener("keydown", function(e){

    if(e.key === "/" && gameStarted){

        e.preventDefault();

        playSound(clickSound);

        showInput(

            language === "zh"
            ? "输入关卡号（从1开始）"
            : "Enter level number",

            function(input){

                // 作弊码
                if(input === "copenhagen"){

                    unlockAllSkins();

                    showMessage(
                        language === "zh"
                        ? "已解锁全部皮肤！"
                        : "All skins unlocked!"
                    );

                    createColorButtons();

                    return;
                }

                if(input === "soul"){

                    cheatMode = !cheatMode;

                    showMessage(
                        cheatMode
                            ? (language === "zh" ? "已开启无敌模式" : "God Mode Enabled")
                            : (language === "zh" ? "已关闭无敌模式" : "God Mode Disabled")
                    );

                    return;
                }

                if(input === "warp"){

                    tpCheat = !tpCheat;

                    showMessage(
                        tpCheat
                            ? (language === "zh" ? "已开启点击传送" : "Click Teleport Enabled")
                            : (language === "zh" ? "已关闭点击传送" : "Click Teleport Disabled")
                    );

                    return;
                }

                /*踩鼠标 if(input === "gui!!!"){

                    mousePlatformCheat = !mousePlatformCheat;

                    showMessage(
                        mousePlatformCheat
                            ? (language === "zh" ? "已开启幽灵地形鼠标" : "Mouse Ghost Ground Enabled")
                            : (language === "zh" ? "已关闭幽灵地形鼠标" : "Mouse Ghost Ground Disabled")
                    );

                    return;
                }*/

                let target =
                    parseInt(input) - 1;

                if(isNaN(target)){

                    showMessage(
                        language === "zh"
                        ? "请输入数字"
                        : "Please enter a number"
                    );

                    return;
                }

                if(target < 0 || target >= levels.length){

                    showMessage(
                        language === "zh"
                        ? "关卡不存在"
                        : "Level does not exist"
                    );

                    return;
                }

                level = target;

                loadLevel(level);
            }
        );
    }
});

// 皮肤预览
function drawSkinPreview(){

    const canvas =
        document.getElementById("skinPreview");

    const ctx2 =
        canvas.getContext("2d");

    ctx2.clearRect(0,0,200,200);

    ctx2.beginPath();

    ctx2.arc(100,100,40,0,Math.PI*2);

    ctx2.fillStyle = previewColor;

    ctx2.fill();
}
