            <h1 id="gamePageTitle">老爷卡carの游戏世界</h1>

                    <img
                        id="parkourCoverImg"
                        alt="跑酷封面"

                    />

                        <h3>开始游戏</h3>
                    </button>
                </div>
                <div class="gamesCards" id="wsol">
                    <h2 id="wsolTitle">是界·局是 Online</h2>
                    <h3 id="wsolSubTitle">风云变幻的卡牌对战游戏！</h3>

                        id="wsolCoverImg"
                        alt="是界局是封面"
                        src="/_DATA/images/mainPageImages/是界局是封面.png"
                    />
                    <button id="wsolBtn">
                        <h3>开始游戏</h3>
                    </button>
                </div>
            </div>
        </div>
