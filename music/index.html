<!doctype html>
<html lang="zh">
    <head>
        <link rel="stylesheet" href="/_CSS/CSSpage/main.css" />
        <link rel="stylesheet" href="/_CSS/CSSpage/mainPage.css" />
        <link rel="stylesheet" href="/_CSS/CSSpage/navigate.css" />

        <link rel="stylesheet" href="/_CSS/CSSaccount/accountPage.css" />

        <link rel="stylesheet" href="/_CSS/CSSgames/gamePage.css" />
        <link rel="stylesheet" href="/_CSS/CSSgames/parkour.css" />

        <link rel="stylesheet" href="/_CSS/CSSmusic/artistsPage.css" />
        <link rel="stylesheet" href="/_CSS/CSSmusic/artistsPagePage.css" />
        <link rel="stylesheet" href="/_CSS/CSSmusic/musicPage.css" />
        <link rel="stylesheet" href="/_CSS/CSSmusic/songsPage.css" />

        <link
            rel="stylesheet"
            href="/_CSS/CSSuniverse/universeCharactersPage.css"
        />
        <link rel="stylesheet" href="/_CSS/CSSuniverse/universePage.css" />
    </head>
    <body>
        <div id="nav"></div>
        <script src="/_JS/easterEgg/date.js"></script>
        <script src="/_JS/data/navigate.js"></script>

        <!-- 音乐页面 -->
        <div id="musicPage">
            <h1 id="musicPageTitle">老爷卡carの音乐世界</h1>
            <h2 id="musicPageSubTitle"></h2>

            <div id="musicPageCards">
                <div id="songsCard">
                    <h2 id="songsCardTitle">歌单</h2>
                    <h3 id="songsCardSubTitle">音乐收录集</h3>
                    <img
                        id="songsCardImg"
                        alt="总歌单"
                        src="/_DATA/images/mainPageImages/总歌单.jpg"
                    />
                    <button id="songsCardBtn">查看</button>
                </div>

                <div id="artistsCard">
                    <h2 id="artistsCardTitle">制作人</h2>
                    <h3 id="artistsCardSubTitle">严选音乐制作人</h3>
                    <img
                        id="artistsCardImg"
                        alt="总制作人"
                        src="/_DATA/images/mainPageImages/总制作人.png"
                    />
                    <button id="artistsCardBtn">查看</button>
                </div>

                <div id="derivativesCard">
                    <h2 id="derivativesCardTitle">衍生</h2>
                    <h3 id="derivativesCardSubTitle">音乐之外，衍生而来</h3>
                    <img
                        id="derivativesCardImg"
                        alt="总衍生"
                        src="/_DATA/images/mainPageImages/总衍生.png"
                    />
                    <button id="derivativesCardBtn">查看</button>
                </div>

                <div id="principlesCard">
                    <h2 id="principlesCardTitle">原则</h2>
                    <h3 id="principlesCardSubTitle">老爷卡car的音乐准则</h3>
                    <img
                        id="principlesCardSubTitle"
                        alt="总原则"
                        src="/_DATA/images/mainPageImages/总原则.jpg"
                    />
                    <button id="principlesCardBtn">查看</button>
                </div>
            </div>
        </div>

        <script src="/main.js"></script>

        <script src="/_JS/buttons/accountButtons.js"></script>
        <script src="/_JS/buttons/gameButtons.js"></script>
        <script src="/_JS/buttons/mainPageButtons.js"></script>
        <script src="/_JS/buttons/musicButtons.js"></script>
        <script src="/_JS/buttons/universeButtons.js"></script>

        <script src="/_JS/data/audio.js"></script>
    </body>
</html>
